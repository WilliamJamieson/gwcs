name: Update Python Versions

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  check_python_classifiers:
    name: check SPEC 0, python classifiers, and RTD Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - name: Update SPEC 0 lower bounds, Python classifiers, and RTD Python
        id: check
        run: |
          # The checks fail when they update files, so only a failure without changes is an error.
          if ! uv tool run --with packaging --with requests --with tomlkit --with ruyaml nox -s check_python_support; then
            if git diff --quiet; then
              echo "check_python_support failed without updating any files"
              exit 1
            fi
          fi

          CHANGES=0
          if ! git diff --quiet; then
            CHANGES=1
          fi
          echo "available=$CHANGES" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.available == '1'
        id: branch
        run: echo "name=classifiers/update-$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
      - if: steps.check.outputs.available == '1'
        name: Configure git credentials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
      - if: steps.check.outputs.available == '1'
        name: Commit changes to `${{ steps.branch.outputs.name }}`
        run: |
          git checkout -b ${{ steps.branch.outputs.name }}
          git commit -a -m "Updating SPEC 0 lower bounds, Python classifiers, and RTD Python"
          git push -u origin ${{ steps.branch.outputs.name }}
      - if: steps.check.outputs.available == '1'
        name: Create pull request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create --head=${{ steps.branch.outputs.name }} \
          --title='Update SPEC 0 lower bounds, python classifiers, and RTD Python' \
          --body='The `check_python_support` nox session ran the following checks in order:

          - `check_spec0` checked that the `requires-python`, numpy, and scipy lower bounds in `pyproject.toml` comply with [SPEC 0](https://scientific-python.org/specs/spec-0000/).
          - `check_python_classifiers` checked whether the Python classifiers in `pyproject.toml` were consistent with `requires-python` and the Python versions published on python.org.
          - `check_rtd_python` checked that `.readthedocs.yaml` uses the recalculated default Python version.

          Any necessary SPEC 0 lower bound, classifier, and/or Read the Docs Python updates are included together in this PR. Please review the changes.'
