name: test

on:
  push:
    branches:
      - main
      # Release branches, e.g. 1.1.x or 0.26.0x
      - "[0-9]+.[0-9]+.x"
      - "[0-9]+.[0-9]+.[0-9]+x"
    tags:
      - "*"
  pull_request:
    # `labeled` re-runs ci_matrix so label-tagged entries get added to the matrix
    types:
      - opened
      - synchronize
      - reopened
      - labeled
  workflow_dispatch:
  schedule:
    # Weekly Monday 9AM build
    # * is a special character in YAML so you have to quote this string
    - cron: "0 9 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Fork PRs into gwcs still run here, since their github.repository is the base repo
    if: github.repository == 'spacetelescope/gwcs' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/nox_matrix.yml
    with:
      matrix_session: ci_matrix
      pr_labels: ${{ github.repository == 'spacetelescope/gwcs' && toJSON(github.event.pull_request.labels.*.name) || '[]' }}
      force_on: ${{ github.event_name == 'workflow_dispatch' || (github.repository == 'spacetelescope/gwcs' && (github.event_name == 'schedule' || github.event_name == 'push')) }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
